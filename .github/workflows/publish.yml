name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Update npm for registry OIDC
        run: npm install -g npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test package entry points
        run: |
          node -e "if (typeof require('./dist/index.js').paginate !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/index.mjs'); if (typeof m.paginate !== 'function') process.exit(1)"
      - run: npm publish --provenance --access public
