name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAGINATE_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/paginate_test
      PAGINATE_TEST_MARIADB_URL: mysql://root:test@127.0.0.1:3306/paginate_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: paginate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: paginate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        mikro-orm: ['6.6.16', '7.2.2']
        nestjs: ['11', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select MikroORM 6 for compatibility run
        if: matrix.mikro-orm == '6.6.16'
        run: pnpm add -D @mikro-orm/core@6.6.16 @mikro-orm/postgresql@6.6.16 @mikro-orm/mysql@6.6.16 @mikro-orm/sqlite@6.6.16
      - name: Select NestJS 11 for compatibility run
        if: matrix.nestjs == '11'
        run: pnpm add -D @nestjs/common@11 @nestjs/core@11 @nestjs/platform-express@11 @nestjs/swagger@11 @nestjs/testing@11
      - run: pnpm format:ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test both package entry points
        run: |
          node -e "if (typeof require('./dist/index.js').paginate !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/index.mjs'); if (typeof m.paginate !== 'function') process.exit(1)"
